# One grouped update a month per ecosystem. Security fixes arrive as soon as they are published.
# Minor and patch updates merge themselves once CI passes; major updates come one at a time and wait for a person.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The types follow the oldest Node.js version Homing supports.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
