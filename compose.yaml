name: homing

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homing
      POSTGRES_PASSWORD: homing
      POSTGRES_DB: homing
    ports:
      - "127.0.0.1:${HOMING_DB_PORT:-5442}:5432"
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homing"]
      interval: 2s
      retries: 30

  # Applies migrations and exits. Only this step holds the admin role.
  migrate:
    build: .
    command: ["node", "src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://homing_app:homing_app@db:5432/homing
      AUTH_DATABASE_URL: postgres://homing_auth:homing_auth@db:5432/homing
      DATABASE_ADMIN_URL: postgres://homing:homing@db:5432/homing
    depends_on:
      db:
        condition: service_healthy

  # Prints a link for creating the first account when it starts.
  homing:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://homing_app:homing_app@db:5432/homing
      AUTH_DATABASE_URL: postgres://homing_auth:homing_auth@db:5432/homing
      # Where people and assistants reach Homing. Anything but localhost needs a secret too.
      HOMING_URL: ${HOMING_URL:-}
      # Required: Homing won't start without it. See docs/deployment.md.
      HOMING_SECRET: ${HOMING_SECRET:-}
      HOMING_TRUSTED_PROXIES: ${HOMING_TRUSTED_PROXIES:-}
      HOMING_ASSISTANT_SITES: ${HOMING_ASSISTANT_SITES:-}
      # Optional: lets Homing send invites and sign-in links by email.
      SMTP_URL: ${SMTP_URL:-}
      HOMING_EMAIL_FROM: ${HOMING_EMAIL_FROM:-}
      # Optional: lets people connect their Microsoft 365 mailbox. See docs/deployment.md.
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-}
      MICROSOFT_CERTIFICATE: ${MICROSOFT_CERTIFICATE:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${HOMING_PORT:-4100}:4100"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db:
